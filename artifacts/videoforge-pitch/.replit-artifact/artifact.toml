kind = "slides"
previewPath = "/videoforge-pitch/"
title = "VideoForge Pitch Deck"
version = "1.0.0"
id = "artifacts/videoforge-pitch"
router = "path"

[[services]]
name = "web"
paths = [ "/videoforge-pitch/" ]
localPort = 23301

[services.development]
run = "pnpm --filter @workspace/videoforge-pitch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/videoforge-pitch", "run", "build" ]
serve = "static"
publicDir = "artifacts/videoforge-pitch/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23301"
BASE_PATH = "/videoforge-pitch/"
